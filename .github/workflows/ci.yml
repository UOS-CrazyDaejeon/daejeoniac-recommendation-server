name: Recommendation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_LLM: "0"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recommendation_api/requirements.txt

      - run: pip install -r recommendation_api/requirements.txt
      - run: python -m unittest test_recommend_llm.py test_recommendation_api.py -v
      - run: docker build -f recommendation_api/Dockerfile -t daejeoniac-recommendation-server:ci .

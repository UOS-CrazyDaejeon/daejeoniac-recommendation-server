name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_LLM: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recommendation_api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r recommendation_api/requirements.txt

      - name: Check Python syntax
        run: python -m compileall recommend_llm.py recommendation_api

      - name: Check FastAPI app import
        run: python -c "from recommendation_api.main import app; print(app.title)"

      - name: Check Docker Compose config
        run: docker compose -f recommendation_api/deploy/docker-compose.yml config

      - name: Build Docker image
        run: docker build -f recommendation_api/Dockerfile -t daejeoniac-recommendation-server:ci .

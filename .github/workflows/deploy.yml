name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}

    steps:
      - name: Validate deployment settings
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          test -n "$EC2_INSTANCE_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Send deployment command
        id: send-command
        run: |
          APP_DIR="${EC2_APP_DIR:-/opt/daejeoniac-recommendation}"
          PARAMS=$(jq -n --arg app_dir "$APP_DIR" '{
            commands: [
              "set -eu",
              ("APP_DIR=" + ($app_dir | @sh)),
              "COMPOSE_FILE=\"$APP_DIR/recommendation_api/deploy/docker-compose.yml\"",
              "sudo -u ubuntu -H git -C \"$APP_DIR\" fetch origin main",
              "sudo -u ubuntu -H git -C \"$APP_DIR\" checkout main",
              "sudo -u ubuntu -H git -C \"$APP_DIR\" pull --ff-only origin main",
              "docker compose -f \"$COMPOSE_FILE\" up -d --build",
              "docker compose -f \"$COMPOSE_FILE\" ps",
              "curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1:8000/openapi.json"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"

          for attempt in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "SSM deployment status: ${STATUS:-Pending}"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" || true
              exit 1
            fi

            sleep 10
          done

          echo "배포 완료 대기 시간이 10분을 초과했습니다."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true
          exit 1

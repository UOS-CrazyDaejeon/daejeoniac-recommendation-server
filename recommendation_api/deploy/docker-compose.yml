services:
  recommendation-api:
    image: ${RECOMMENDATION_IMAGE:-daejeon-recommendation-api:local}
    build:
      context: ../..
      dockerfile: recommendation_api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
